    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":453,"height":912},"initialScreen":{"editor":"enum","options":["home","passeios","meus","viagem","carteira","perfil"],"default":"home","tsType":"string","section":"Protótipo"},"sheetOpen":{"editor":"boolean","default":false,"tsType":"boolean","section":"Protótipo"},"autoplay":{"editor":"boolean","default":true,"tsType":"boolean","section":"Protótipo"}}'
    >
      const CHIPS = ['Todos','Deserto','Marina & Iates','Aéreo','Cidade & Cultura','Gastronomia','Compras','Parques','Exclusivos Fly'];
      const KEYS = ['todos','deserto','marina','aereo','cidade','gastro','compras','parques','exclusivos'];
      const CATS = {
        c1: ['Cidade & Cultura','Exclusivos Fly'],
        c2: ['Gastronomia','Exclusivos Fly'],
        c3: ['Marina & Iates','Exclusivos Fly'],
        c4: ['Cidade & Cultura'],
        c5: ['Aéreo']
      };
      const CARD_KEYS = ['c1','c2','c3','c4','c5'];
      const DAYS = ['25','26','27','28','29','30','31'];
      const DAY_TITLES = { '25': 'Sexta, 25 de agosto', '26': 'S\u00e1bado, 26 de agosto', '27': 'Domingo, 27 de agosto',
        '28': 'Segunda, 28 de agosto', '29': 'Ter\u00e7a, 29 de agosto', '30': 'Quarta, 30 de agosto', '31': 'Quinta, 31 de agosto' };
      const DAY_COUNTS = { '25': '4 itens', '27': '3 itens', '29': '3 itens' };
      class Component extends DCLogic {
        state = { screen: null, sheet: null, slide: 0, chip: 'Todos', cart: 2, pop: false,
                  sos: false, toast: false, seg: 'conf', dx: 0, dragging: false, notif: true, day: '25' };
        get scr() { return this.state.screen ?? (this.props.initialScreen || 'home'); }
        get isSheet() { return this.state.sheet ?? !!this.props.sheetOpen; }
        componentDidMount() {
          this.timer = setInterval(() => {
            if (this.state.dragging || this.props.autoplay === false) return;
            this.setState(s => ({ slide: (s.slide + 1) % 3 }));
          }, 5400);
        }
        componentWillUnmount() {
          clearInterval(this.timer); clearTimeout(this.pt); clearTimeout(this.tt);
        }
        go = (screen) => this.setState({ screen, sheet: false, sos: false, toast: false });
        add = () => {
          this.setState(s => ({ cart: s.cart + 1, pop: true, toast: true }));
          clearTimeout(this.pt); clearTimeout(this.tt);
          this.pt = setTimeout(() => this.setState({ pop: false }), 380);
          this.tt = setTimeout(() => this.setState({ toast: false }), 2800);
        };
        cartTap = () => {
          this.setState({ toast: true });
          clearTimeout(this.tt);
          this.tt = setTimeout(() => this.setState({ toast: false }), 2800);
        };
        dragStart = (e) => { this.sx = e.clientX; this.setState({ dragging: true, dx: 0 }); };
        dragMove = (e) => { if (this.state.dragging) this.setState({ dx: e.clientX - this.sx }); };
        dragEnd = () => {
          const { dx, slide } = this.state;
          let n = slide;
          if (dx < -46) n = Math.min(2, slide + 1);
          else if (dx > 46) n = Math.max(0, slide - 1);
          this.setState({ dragging: false, dx: 0, slide: n });
        };
        renderVals() {
          const scr = this.scr, chip = this.state.chip, st = this.state;
          const on = (b) => ({
            bg: b ? 'rgba(223,201,138,.15)' : 'rgba(255,255,255,.05)',
            bd: b ? 'rgba(223,201,138,.44)' : 'rgba(255,255,255,.075)',
            c:  b ? '#DFC98A' : 'rgba(245,245,247,.6)'
          });
          const chips = {};
          KEYS.forEach((k, i) => { chips[k] = on(chip === CHIPS[i]); });
          const dayChips = {};
          DAYS.forEach(d => {
            const sel = st.day === d;
            dayChips['d' + d] = {
              bg: sel ? 'rgba(223,201,138,.15)' : 'rgba(255,255,255,.05)',
              bd: sel ? 'rgba(223,201,138,.44)' : 'rgba(255,255,255,.075)',
              c: sel ? '#DFC98A' : 'rgba(245,245,247,.6)'
            };
          });
          const vis = (k) => chip === 'Todos' || CATS[k].indexOf(chip) >= 0;
          const cards = {};
          CARD_KEYS.forEach(k => { cards[k] = { d: vis(k) ? 'block' : 'none' }; });
          const segOn = (b) => ({
            bg: b ? 'rgba(255,255,255,.13)' : 'transparent',
            bd: b ? 'rgba(255,255,255,.1)' : 'transparent',
            c:  b ? '#F5F5F7' : 'rgba(245,245,247,.45)'
          });
          const active = '#F5F5F7', idle = 'rgba(245,245,247,.4)';
          const pct = (-100 / 3 * st.slide).toFixed(4) + '%';
          return {
            isHome: scr === 'home',
            isPasseios: scr === 'passeios',
            isMeus: scr === 'meus',
            isCarteira: scr === 'carteira',
            isPerfil: scr === 'perfil',
            isViagem: scr === 'viagem',
            days: dayChips,
            dayD: {
              d25: st.day === '25' ? 'block' : 'none',
              d27: st.day === '27' ? 'block' : 'none',
              d29: st.day === '29' ? 'block' : 'none',
              livre: DAY_COUNTS[st.day] ? 'none' : 'block'
            },
            dayTitle: DAY_TITLES[st.day],
            dayCount: DAY_COUNTS[st.day] || 'dia livre',
            setD25: () => this.setState({ day: '25' }),
            setD26: () => this.setState({ day: '26' }),
            setD27: () => this.setState({ day: '27' }),
            setD28: () => this.setState({ day: '28' }),
            setD29: () => this.setState({ day: '29' }),
            setD30: () => this.setState({ day: '30' }),
            setD31: () => this.setState({ day: '31' }),
            notif: {
              bg: st.notif ? 'rgba(223,201,138,.85)' : 'rgba(255,255,255,.16)',
              x: st.notif ? '21px' : '2.5px'
            },
            toggleNotif: () => this.setState(s => ({ notif: !s.notif })),
            isStub: false,
            stubTitle: '',
            sheet: this.isSheet && (scr === 'passeios' || scr === 'meus'),
            sos: st.sos,
            toast: st.toast,
            toastText: st.cart === 1 ? '1 experiência no carrinho' : st.cart + ' experiências no carrinho',
            cart: st.cart,
            cartPop: st.pop ? 'scale(1.22)' : 'scale(1)',
            chips, cards,
            emptyCat: !CARD_KEYS.some(vis),
            seg: {
              conf: segOn(st.seg === 'conf'),
              hist: segOn(st.seg === 'hist'),
              confD: st.seg === 'conf' ? 'block' : 'none',
              histD: st.seg === 'hist' ? 'block' : 'none'
            },
            trackX: st.dragging
              ? 'translateX(calc(' + pct + ' + ' + st.dx + 'px))'
              : 'translateX(' + pct + ')',
            trackTr: st.dragging ? 'none' : 'transform .62s cubic-bezier(.32,.9,.28,1)',
            dotX: 'translateX(' + (st.slide * 24) + 'px)',
            tabs: {
              home: scr === 'home' ? active : idle,
              passeios: (scr === 'passeios' || scr === 'meus') ? active : idle,
              viagem: scr === 'viagem' ? active : idle,
              carteira: scr === 'carteira' ? active : idle,
              perfil: scr === 'perfil' ? active : idle
            },
            centerBd: scr === 'viagem' ? 'rgba(223,201,138,.75)' : 'rgba(223,201,138,.28)',
            wingOp: scr === 'viagem' ? 1 : 0.72,
            noop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
            goHome: () => this.go('home'),
            goPasseios: () => this.go('passeios'),
            goViagem: () => this.go('viagem'),
            goCarteira: () => this.go('carteira'),
            goPerfil: () => this.go('perfil'),
            goMeus: () => this.go('meus'),
            openSheet: () => this.setState({ sheet: true, sos: false }),
            closeSheet: () => this.setState({ sheet: false }),
            toggleSos: () => this.setState(s => ({ sos: !s.sos })),
            add: this.add,
            cartTap: this.cartTap,
            setTodos: () => this.setState({ chip: 'Todos' }),
            setDeserto: () => this.setState({ chip: 'Deserto' }),
            setMarina: () => this.setState({ chip: 'Marina & Iates' }),
            setAereo: () => this.setState({ chip: 'Aéreo' }),
            setCidade: () => this.setState({ chip: 'Cidade & Cultura' }),
            setGastro: () => this.setState({ chip: 'Gastronomia' }),
            setCompras: () => this.setState({ chip: 'Compras' }),
            setParques: () => this.setState({ chip: 'Parques' }),
            setExclusivos: () => this.setState({ chip: 'Exclusivos Fly' }),
            segConf: () => this.setState({ seg: 'conf' }),
            segHist: () => this.setState({ seg: 'hist' }),
            dragStart: this.dragStart,
            dragMove: this.dragMove,
            dragEnd: this.dragEnd
          };
        }
      }
